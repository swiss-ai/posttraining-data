[project]
name = "apertus2-processing"
version = "0.1.0"
description = "Distributed checking and tokenization of native Apertus 2 datasets"
requires-python = ">=3.13"
dependencies = [
  "apertus-common[hf] @ git+https://github.com/swiss-ai/apertus-common.git@8bcc096696bfe4fce22e76fb74f589040f86d21b",
  "datasets>=4,<6",
  "pyarrow>=21",
  "numpy>=2",
]

[project.scripts]
apertus-data = "apertus2_processing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
