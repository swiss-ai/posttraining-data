    config_name: null
    split_name: train
    prompt_col_name: prompt
  - name_or_path: allenai/IFBench_test
    config_name: null
    split_name: train
    prompt_col_name: prompt
  - name_or_path: facebook/Multi-IF
    config_name: null
    split_name: train
    prompt_col_name: turn_1_prompt
  - name_or_path: tatsu-lab/alpaca_eval
    config_name: null
    split_name: eval
    prompt_col_name: instruction
  - name_or_path: HuggingFaceH4/mt_bench_prompts
    config_name: null
    split_name: train
    prompt_col_name: prompt
  - name_or_path: lmarena-ai/arena-hard-auto
    config_name: null
    split_name: test
    prompt_col_name: prompt
  - name_or_path: CohereLabs/m-ArenaHard-v2.0
    config_name: iterate
    split_name: test
    prompt_col_name: prompt

  # ── Medical ──────────────────────────────────────────────────────────────
  # openlifescienceai/medmcqa: validation is the split evaluated on (test has no labels).
  - name_or_path: openlifescienceai/medmcqa
    config_name: null
    split_name: validation
    prompt_col_name: question
  - name_or_path: GBaker/MedQA-USMLE-4-options
