    config_name: prompts
    split_name:
      - hate_trans_1k
      - neutral_black_1k
      - hate_native_american_1k
      - neutral_immigrant_1k
      - hate_middle_east_1k
      - neutral_lgbtq_1k
      - neutral_women_1k
      - neutral_chinese_1k
      - hate_latino_1k
      - hate_bisexual_1k
      - hate_mexican_1k
      - hate_asian_1k
      - neutral_mental_disability_1k
      - neutral_mexican_1k
      - hate_mental_disability_1k
      - neutral_bisexual_1k
      - neutral_latino_1k
      - hate_chinese_1k
      - neutral_jewish_1k
      - hate_muslim_1k
      - neutral_asian_1k
