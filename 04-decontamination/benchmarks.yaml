# Evaluation benchmarks whose prompts are gathered for decontamination
# (read by gather-decontamination-prompts.py).
#
# Each entry:
#   name_or_path:    HF dataset (lmarena-ai/arena-hard-auto and DAMO-NLP-SG/MultiJail are handled
#                    specially in the script)
#   config_name:     a config, a list of configs, "iterate" (all configs of the dataset) or null;
#                    a listed config that cannot be loaded stops the gathering, "iterate" skips it
#   split_name:      a split or a list of splits (concatenated); the splits that are evaluated on,
#                    never a train split of a benchmark that has separate evaluation splits
#   prompt_col_name: column holding the prompt (for a list of turns, the first turn is used)
#   name:            optional; name of the entry in the prompt set (default: name_or_path with
#                    "/" replaced by "__", plus "__<config>" for each config of a list or "iterate")
#
# A benchmark that is a copy or a subset of another one is left out (noted in a comment).
#
# The n-gram cache of the decontamination is keyed by the entry name, not by its content: when the
# prompts of an entry change (other split, config or column), give it a new name or use a new cache dir.

benchmarks:
  # ── Knowledge and reasoning (MCQ) ─────────────────────────────────────────
  - name_or_path: cais/mmlu
    config_name: all
    split_name: test
    prompt_col_name: question
  - name_or_path: TIGER-Lab/MMLU-Pro
    config_name: null
    split_name: test
    prompt_col_name: question
  - name_or_path: CohereLabs/Global-MMLU
    config_name: iterate
    split_name: test
    prompt_col_name: question
  - name_or_path: li-lab/MMLU-ProX
    config_name: iterate
    split_name: test
    prompt_col_name: question
  - name_or_path: CohereLabs/include-base-44
    config_name: iterate
    split_name: test
    prompt_col_name: question
  - name_or_path: swiss-ai/include-base-new-45
    config_name: iterate
    split_name: test
    prompt_col_name: question
  - name_or_path: swiss-ai/switzerland_qa
    config_name: iterate
    split_name: test
    prompt_col_name: question
  - name_or_path: allenai/ai2_arc
    config_name: iterate
    split_name: test
    prompt_col_name: question
  - name_or_path: alexandrainst/m_arc
    config_name: iterate
    split_name: test
    prompt_col_name: instruction
  - name_or_path: LumiOpen/arc_challenge_mt
    config_name: iterate
    split_name: test
    prompt_col_name: question
  - name_or_path: Idavidrein/gpqa
    config_name: gpqa_main
    split_name: train
    prompt_col_name: Pre-Revision Question
  # Evaluations use the revised "Question" text; the pre-revision entry is kept.
  - name_or_path: Idavidrein/gpqa
    name: Idavidrein__gpqa__gpqa_main__question
    config_name: gpqa_main
    split_name: train
    prompt_col_name: Question
  - name_or_path: lukaemon/bbh
    config_name: iterate
    split_name: test
    prompt_col_name: input
  - name_or_path: EleutherAI/drop
    config_name: null
    split_name: validation
    prompt_col_name: question
  - name_or_path: ibm-research/acp_bench
    config_name: iterate
    split_name: test
    prompt_col_name: question
  # swiss-ai/mlogiqa is a copy of this.
  - name_or_path: Qwen/P-MMEval
    config_name: [mlogiqa]
    split_name: test
    prompt_col_name: question
  - name_or_path: cais/wmdp
    config_name: iterate
    split_name: test
    prompt_col_name: question

  # ── Commonsense ──────────────────────────────────────────────────────────
  # Rowan/hellaswag: validation is the split evaluated on (test has no labels).
  - name_or_path: Rowan/hellaswag
    config_name: null
    split_name: test
    prompt_col_name: ctx
  - name_or_path: Rowan/hellaswag
    name: Rowan__hellaswag__validation
    config_name: null
    split_name: validation
    prompt_col_name: ctx
  - name_or_path: alexandrainst/m_hellaswag
    config_name: iterate
    split_name: val
    prompt_col_name: ctx
  - name_or_path: baber/piqa
    config_name: null
    split_name: [validation, test]
    prompt_col_name: goal
  - name_or_path: tau/commonsense_qa
    config_name: null
    split_name: [validation, test]
    prompt_col_name: question
  - name_or_path: cambridgeltl/xcopa
    config_name: iterate
    split_name: [validation, test]
    prompt_col_name: premise
  - name_or_path: facebook/xnli
    config_name: [ar, bg, de, el, en, es, fr, hi, ru, sw, th, tr, ur, vi, zh]
    split_name: [validation, test]
    prompt_col_name: premise
  # The "default" config is a copy of "en".
  - name_or_path: EleutherAI/lambada_openai
    config_name: [en, de, es, fr, it]
    split_name: test
    prompt_col_name: text
  # All configs share the same validation and test splits; validation is the split evaluated on
  # (test has no labels).
  - name_or_path: allenai/winogrande
    config_name: winogrande_xl
    split_name: [validation, test]
    prompt_col_name: sentence

  # ── Truthfulness and hallucination ───────────────────────────────────────
  # The multiple_choice config has the same 817 questions.
  - name_or_path: truthfulqa/truthful_qa
    config_name: [generation]
    split_name: validation
    prompt_col_name: question
  - name_or_path: alexandrainst/m_truthfulqa
    config_name: iterate
    split_name: val
    prompt_col_name: question
  # The "en" config is a copy of truthfulqa/truthful_qa.
  - name_or_path: HiTZ/truthfulqa-multi
    config_name: [es, ca, gl, eu]
    split_name: validation
    prompt_col_name: question
  - name_or_path: swiss-ai/hallulens
    config_name: iterate
    split_name: test
    prompt_col_name: prompt
  - name_or_path: basicv8vc/SimpleQA
    config_name: null
    split_name: test
    prompt_col_name: problem

  # ── Math ─────────────────────────────────────────────────────────────────
  - name_or_path: openai/gsm8k
    config_name: main
    split_name: test
    prompt_col_name: question
  - name_or_path: madrylab/gsm8k-platinum
    config_name: null
    split_name: test
    prompt_col_name: question
  - name_or_path: juletxara/mgsm
    config_name: iterate
    split_name: test
    prompt_col_name: question
  # DigitalLearningGmbH/MATH-lighteval (test) and HuggingFaceH4/MATH-500 are a copy and a subset of this.
  - name_or_path: EleutherAI/hendrycks_math
    config_name: iterate
    split_name: test
    prompt_col_name: problem
  # swiss-ai/math_qa is a copy of this (plus the train and validation splits).
  - name_or_path: allenai/math_qa
    config_name: null
    split_name: test
    prompt_col_name: Problem
  - name_or_path: AI-MO/aimo-validation-aime
    config_name: null
    split_name: train
    prompt_col_name: problem
  - name_or_path: Qwen/PolyMath
    config_name: iterate
    split_name: [top, high, medium, low]
    prompt_col_name: question
  # AI-MO/aimo-validation-aime only covers AIME 2022-2024.
  - name_or_path: MathArena/aime_2025
    config_name: null
    split_name: train
    prompt_col_name: problem
  - name_or_path: MathArena/aime_2026
    config_name: null
    split_name: train
    prompt_col_name: problem
  - name_or_path: MathArena/hmmt_feb_2025
    config_name: null
    split_name: train
    prompt_col_name: problem
  - name_or_path: MathArena/hmmt_feb_2026
    config_name: null
    split_name: train
    prompt_col_name: problem
  - name_or_path: MathArena/brumo_2025
    config_name: null
    split_name: train
    prompt_col_name: problem
  - name_or_path: math-ai/amc23
    config_name: null
    split_name: test
    prompt_col_name: question

  # ── Code ─────────────────────────────────────────────────────────────────
  - name_or_path: openai/openai_humaneval
    config_name: null
    split_name: test
    prompt_col_name: prompt
  - name_or_path: google-research-datasets/mbpp
    config_name: full
    split_name: test
    prompt_col_name: text
  - name_or_path: bigcode/bigcodebench
    config_name: null
    split_name: v0.1.0_hf
    prompt_col_name: instruct_prompt
  # Parquet copy of livecodebench/code_generation_lite (which needs a loading script);
  # release_latest contains all earlier releases.
  - name_or_path: lighteval/code_generation_lite
    config_name: release_latest
    split_name: test
    prompt_col_name: question_content

  # ── Long context ─────────────────────────────────────────────────────────
  - name_or_path: THUDM/LongBench
    config_name: [hotpotqa]
    split_name: test
    prompt_col_name: input

  # ── Instruction following and chat ───────────────────────────────────────
