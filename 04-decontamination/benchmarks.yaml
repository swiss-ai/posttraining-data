  - name_or_path: swiss-ai/harmbench
    config_name: [DirectRequest, HumanJailbreaks]
    split_name: test
    prompt_col_name: Behavior
  - name_or_path: DAMO-NLP-SG/MultiJail
    config_name: null
    split_name: train
    prompt_col_name: [en, zh, it, vi, ar, ko, th, bn, sw, jv]

  # ── AGIEval ──────────────────────────────────────────────────────────────
