      - hate_lgbtq_1k
      - hate_women_1k
      - neutral_middle_east_1k
      - neutral_native_american_1k
      - neutral_physical_disability_1k
    prompt_col_name: text
  # swiss-ai/realtoxicityprompts is a copy of this.
  - name_or_path: allenai/real-toxicity-prompts
    config_name: null
    split_name: train
    prompt_col_name: prompt
  # swiss-ai/polyglotoxicityprompts is a subset of this. The ptp-* configs have the splits full and small
  # (a subset of full), the wildchat-* configs only the split wildchat.
  - name_or_path: ToxicityPrompts/PolygloToxicityPrompts
    config_name: [ptp-ar, ptp-cs, ptp-de, ptp-en, ptp-es, ptp-fr, ptp-hi, ptp-id, ptp-it, ptp-ja, ptp-ko, ptp-nl, ptp-pl, ptp-pt, ptp-ru, ptp-sv, ptp-zh]
    split_name: full
    prompt_col_name: prompt
  - name_or_path: ToxicityPrompts/PolygloToxicityPrompts
    config_name: [wildchat-ar, wildchat-cs, wildchat-de, wildchat-en, wildchat-es, wildchat-fr, wildchat-hi, wildchat-id, wildchat-it, wildchat-ja, wildchat-ko, wildchat-nl, wildchat-pl, wildchat-pt, wildchat-ru, wildchat-sv, wildchat-zh]
    split_name: wildchat
    prompt_col_name: prompt
  - name_or_path: oskarvanderwal/bbq
    config_name: All
    split_name: test
    prompt_col_name: question
  - name_or_path: CohereLabs/aya_redteaming
    config_name: null
    split_name: [arabic, english, filipino, french, hindi, russian, serbian, spanish]
