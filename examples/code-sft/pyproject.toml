[project]
name = "posttraining-code-sft"
version = "0.1.0"
description = "Environment for the coding SFT recipe for Apertus 2 standardisation and decontamination"
requires-python = ">=3.13"
dependencies = [
  "apertus-common[hf] @ git+https://github.com/swiss-ai/apertus-common.git@8bcc096696bfe4fce22e76fb74f589040f86d21b",
  "datasets>=4,<6", "huggingface-hub>=0.34", "pyarrow>=21",
  "pyyaml>=6", "requests>=2.32", "duckdb>=1.4,<2",
  "pyahocorasick>=2.1", "rensa==0.5.0", "jsonschema>=4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../02-standardisation/code-sft/tests", "../../04-decontamination/code-sft/tests"]
pythonpath = ["../../02-standardisation/code-sft", "../../04-decontamination/code-sft", "../../02-standardisation/code-sft/tests", "../../04-decontamination/code-sft/tests"]
